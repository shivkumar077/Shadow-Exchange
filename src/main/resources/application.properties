spring.application.name=shadow-exchange
server.port=${PORT:8080}

# In-memory H2 database (runs out of the box without needing external PostgreSQL server)
spring.datasource.url=jdbc:h2:mem:shadow_exchange;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# PostgreSQL configuration (uncomment when running a PostgreSQL server)
# spring.datasource.url=jdbc:postgresql://localhost:5432/shadow_exchange
# spring.datasource.username=shadow
# spring.datasource.password=shadow123

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Reverse proxy forwarded headers support (Render / Vercel proxy)
server.forward-headers-strategy=${SERVER_FORWARD_HEADERS_STRATEGY:framework}
server.servlet.session.cookie.same-site=lax

# Frontend redirect origin
app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}

# Google OAuth2 / OpenID Connect Client Configuration
# In production, these are injected via environment variables:
# - GOOGLE_CLIENT_ID (or SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID)
# - GOOGLE_CLIENT_SECRET (or SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET)
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID:mock-google-client-id}}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET:mock-google-client-secret}}
spring.security.oauth2.client.registration.google.scope=openid,email,profile
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}


