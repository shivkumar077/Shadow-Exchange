spring.application.name=shadow-exchange
server.port=${PORT:8080}

# In-memory H2 database (runs out of the box without needing external PostgreSQL server)
spring.datasource.url=jdbc:h2:mem:shadow_exchange;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# PostgreSQL configuration (uncomment when running a PostgreSQL server)
# spring.datasource.url=jdbc:postgresql://localhost:5432/shadow_exchange
# spring.datasource.username=shadow
# spring.datasource.password=shadow123

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true


