# Activate with SPRING_PROFILES_ACTIVE=prod.
# Set these values in the hosting provider's environment/secrets; never commit credentials.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Convenient during initial hosted setup. Replace with validated schema migrations
# before treating this as a production-grade deployment.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
